<title>이정민 경력 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* portfolio02 와 같은 흑백 선화 + 점묘 질감의 기술 문서풍. 포인트 색은 파랑(시작)·주황(지금·선택) 두 가지만 쓴다.
     종이 인쇄물 같은 단일 테마로 고정하고 모든 색을 직접 지정한다. */
  :root {
    color-scheme: light;
    --page: #e7e7e3;
    --paper: #fcfcfa;
    --well: #f1f1ee;
    --ink: #151515;
    --muted: #6d6d68;
    --faint: #b9b9b3;
    --blue: #2f5bff;
    --orange: #ff5a1f;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace, "Noto Sans KR";
    --hard: 4px 4px 0 var(--ink);
  }
  body { background: var(--page); color: var(--ink); font: 14px/1.6 "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  button:focus-visible, .rack:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  /* 산업군 견본: 점묘 밀도로 구분하는 작은 네모 */
  .sw { display: inline-block; width: 10px; height: 10px; border: 1px solid var(--ink); vertical-align: -1px; flex: none; }

  /* ---- 도면 창: 첫 화면 전체를 쓰고, 패널은 그 위에 띄운다 ---- */
  .board { position: relative; }
  .stage { position: relative; height: 100vh; min-height: 620px; overflow: hidden; background: var(--paper); cursor: grab; touch-action: none; user-select: none; }
  .stage.drag { cursor: grabbing; }
  .pan { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .scene svg { display: block; overflow: visible; }

  /* 줌 단계별 표시. 도면 창에 lod-far(멀리)·lod-near(가까이) 클래스가 붙는다. 둘 다 없으면 기본 단계. */
  .labels { position: absolute; inset: 0; pointer-events: none; }
  .era-lab, .ncard { position: absolute; left: 0; top: 0; opacity: 0; visibility: hidden; transition: opacity .3s, visibility .3s; }
  .era-lab {
    transform: translate(calc(-100% - 14px), -50%); white-space: nowrap;
    display: flex; align-items: baseline; gap: 8px; padding: 6px 10px;
    background: var(--paper); border: 1px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); font-size: 13px;
  }
  .era-lab b { font: 600 12px var(--mono); }
  .era-lab strong { font-weight: 700; }
  .era-lab span { font: 400 11px var(--mono); color: var(--muted); }
  .stage:not(.lod-near) .era-lab { opacity: 1; visibility: visible; }
  .lod-far .era-lab { font-size: 15px; padding: 8px 12px; }
  .ncard {
    /* --cs: 기본 단계에서는 배율에 맞춰 카드를 줄여 옆 카드와 겹치지 않게 한다(가까이 단계에서는 1). 아래 가운데를 기준으로 줄인다. */
    transform: translate(-50%, calc(-100% - 22px)) scale(var(--cs, 1)); transform-origin: 50% calc(100% + 22px);
    width: 240px; cursor: pointer; display: grid; gap: 5px; padding: 10px 12px; font-size: 12px; line-height: 1.45;
    background: var(--paper); border: 1px solid var(--ink); box-shadow: 3px 3px 0 var(--ink);
  }
  /* 정보 카드는 멀리 단계에서만 감춘다 */
  .stage:not(.lod-far) .ncard { opacity: 1; visibility: visible; pointer-events: auto; }
  /* 선택한 카드는 한 칸 더 띄워 그 아래로 선택 핀이 보이게 한다 */
  .ncard.sel { z-index: 1; border-color: var(--orange); box-shadow: 4px 4px 0 var(--orange);
    transform: translate(-50%, calc(-100% - 70px)) scale(var(--cs, 1)); transform-origin: 50% calc(100% + 70px); }
  .ncard.hot { border-color: var(--blue); }
  .ncard.dim { opacity: .2; }
  .nc-h { display: flex; align-items: center; gap: 6px; color: var(--muted); font: 400 11px var(--mono); }
  .ncard > b { font-size: 13px; line-height: 1.35; }
  .nc-m { color: var(--muted); }
  .ncard .tag { font-size: 10px; padding: 3px 5px; }
  .era-rg { fill: none; stroke: var(--faint); stroke-width: 1.2; stroke-dasharray: 6 5; vector-effect: non-scaling-stroke; transition: fill .3s, stroke .3s; }
  .lod-far .era-rg { fill: rgba(21, 21, 21, .03); stroke: var(--ink); }
  /* 멀리서는 작은 글씨를 걷어 낸다 */
  .fine { transition: opacity .3s; }
  .lod-far .fine { opacity: 0; }

  /* ---- 패널: 흰 종이, 검은 테두리, 딱 떨어지는 그림자, 모노스페이스 대문자 머리줄 ---- */
  .panel { background: var(--paper); border: 1px solid var(--ink); box-shadow: var(--hard); }
  .ph { margin: 0; padding: 11px 16px; border-bottom: 1px solid var(--faint); font: 500 13px var(--mono); letter-spacing: .06em; text-transform: uppercase; display: flex; justify-content: space-between; gap: 8px; }
  .ph span { color: var(--muted); letter-spacing: 0; text-transform: none; }
  .pb { padding: 14px 16px; display: grid; gap: 12px; }
  @media (min-width: 761px) {
    .hud-l { position: absolute; top: 20px; left: 20px; width: 340px; z-index: 2; }
    /* 오른쪽 열: 선택 카드 아래로 전체 목록이 도크 위까지 채운다 */
    .side { position: absolute; top: 20px; right: 24px; bottom: 108px; width: 320px; z-index: 2; display: flex; flex-direction: column; gap: 16px; }
    .card { flex: none; }
    .plist { flex: 1; min-height: 0; }
  }
  @media (max-width: 760px) {
    .stage { height: 64vh; min-height: 420px; }
    .hud-l, .card, .plist { margin: 14px 16px; }
    .plist ol { max-height: 50vh; }
  }

  /* 왼쪽 위: 이름·통계·직위·범례·필터 */
  h1 { margin: 0; font-size: 26px; font-weight: 700; line-height: 1.15; letter-spacing: -.02em; }
  .lede { margin: 0; font-size: 13px; color: var(--muted); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; padding-top: 12px; border-top: 1px dashed var(--faint); }
  .stat { display: grid; }
  .stat b { font: 600 19px var(--mono); line-height: 1.3; }
  .stat span { font-size: 11px; color: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: 500 11px/1 var(--mono); white-space: nowrap; cursor: pointer; padding: 6px 8px;
    border: 1px solid var(--ink); background: var(--paper); color: var(--ink); box-shadow: 2px 2px 0 var(--ink);
    transition: transform .12s, box-shadow .12s;
  }
  .chip:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .steps { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 11px; }
  .step { padding: 3px 6px; border: 1px solid var(--ink); white-space: nowrap; }
  .step.now { background: var(--orange); border-color: var(--orange); color: #fff; }
  .step b { font-weight: 700; }
  .step span { margin-left: 4px; font-family: var(--mono); }
  .steps i { color: var(--muted); font-style: normal; }

  /* 오른쪽 위: 선택한 프로젝트 */
  .card h2 { margin: 0; font-size: 19px; font-weight: 700; line-height: 1.35; text-wrap: balance; }
  .card .per { font: 400 12px var(--mono); color: var(--muted); }
  .card .per b { color: var(--orange); font-weight: 600; }
  .card dl { margin: 0; display: grid; grid-template-columns: 56px 1fr; gap: 3px 10px; font-size: 13px; }
  .card dt { color: var(--muted); font-size: 12px; }
  .card dd { margin: 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { font: 500 11px/1 var(--mono); padding: 4px 6px; border: 1px solid var(--ink); background: var(--paper); }
  .nav { display: flex; gap: 10px; }
  .btn {
    font: 500 12px var(--mono); padding: 8px 12px; cursor: pointer; white-space: nowrap;
    background: var(--paper); color: var(--ink); border: 1px solid var(--ink); box-shadow: 3px 3px 0 var(--ink);
    transition: transform .12s, box-shadow .12s;
  }
  .btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
  .nav .btn { flex: 1; }
  .card-in { animation: cardIn .35s ease-out; }
  @keyframes cardIn { from { opacity: .3; transform: translateY(6px); } }

  /* 아래: 타임라인 + 확대 도구 */
  .dock { position: absolute; left: 20px; right: 24px; bottom: 24px; z-index: 2; display: flex; align-items: center; gap: 14px; padding: 10px 14px; }
  .play { background: var(--ink); color: var(--paper); min-width: 124px; }
  .track { position: relative; flex: 1; height: 38px; min-width: 0; }
  .track .axis { position: absolute; left: 0; right: 0; top: 13px; height: 1px; background: var(--faint); }
  .seg {
    position: absolute; top: 7px; height: 13px; min-width: 6px; border: 1px solid var(--ink); padding: 0; cursor: pointer;
    transition: transform .15s, opacity .15s, box-shadow .15s;
  }
  .seg:hover, .seg.hot { transform: translateY(-2px); }
  .seg.sel { border-color: var(--orange); box-shadow: 0 0 0 2px var(--orange); }
  .seg.dim { opacity: .15; }
  .yr { position: absolute; top: 24px; font: 400 10px var(--mono); color: var(--muted); transform: translateX(-50%); }
  .zoom { display: flex; gap: 8px; }
  .zoom .btn { min-width: 34px; padding-inline: 10px; }
  @media (max-width: 760px) {
    .dock { left: 10px; right: 10px; bottom: 10px; gap: 8px; padding: 8px; }
    .play { min-width: 0; }
    .zoom .fit { display: none; }
    .yr:nth-child(odd) { display: none; }
  }

  /* 마우스를 올린 블록 이름 */
  .tip {
    position: absolute; z-index: 3; pointer-events: none; max-width: 280px;
    background: var(--ink); color: var(--paper); font-size: 12px; line-height: 1.45; padding: 7px 10px;
    transform: translate(14px, 14px);
  }
  .tip b { display: block; font-weight: 500; }
  .tip span { opacity: .75; font: 400 11px var(--mono); }

  /* ---- SVG 도면 ---- */
  .zone-year { font: 600 18px var(--mono); fill: var(--ink); }
  .tag-t { font: 500 13px var(--mono); fill: var(--ink); }
  .live { font: 600 13px var(--mono); fill: var(--orange); }
  .start { font: 600 13px var(--mono); fill: var(--blue); letter-spacing: .08em; }
  .chipnum { font: 600 16px var(--mono); fill: #fff; }
  /* 연결선은 시간 방향으로 흐르는 점선. 선택한 블록에 붙은 선은 주황으로 굵힌다. */
  .wire { fill: none; stroke: var(--ink); stroke-width: 1.3; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 4 4; animation: flow 1.1s linear infinite; }
  .wire.lit { stroke: var(--orange); stroke-width: 2.2; }
  .arrow { fill: var(--ink); }
  .arrow.lit { fill: var(--orange); }
  @keyframes flow { to { stroke-dashoffset: -8; } }
  .band { fill: var(--orange); opacity: 0; transition: opacity .25s; }
  .band.sel { opacity: .16; }
  .ring { fill: none; stroke: var(--orange); stroke-width: 1.6; vector-effect: non-scaling-stroke; stroke-dasharray: 5 4; animation: flow 1.1s linear infinite; }
  .rack { cursor: pointer; outline: none; transition: opacity .25s, transform .2s; animation: drop .7s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(var(--k) * 45ms); }
  .rack:hover { transform: translateY(-5px); }
  .rack .f { stroke: var(--ink); stroke-width: 1.1; stroke-linejoin: round; }
  .rack .top { transition: fill .15s; }
  .rack.hot .top { fill: #e6ebff; }
  .rack.sel .top { fill: #ffe1d5; stroke: var(--orange); stroke-width: 2; }
  @keyframes drop { from { transform: translateY(-60px); opacity: 0; } }
  .dim { opacity: .18; }
  .pin { transition: transform .6s cubic-bezier(.2, .8, .2, 1), opacity .3s; pointer-events: none; }
  /* 핀도 정보 카드처럼 멀리 단계에서만 감춘다 */
  .lod-far .pin { opacity: 0; }
  .pin-b { animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-8px); } }
  .pulse { fill: none; stroke: var(--orange); stroke-width: 2.5; transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-out infinite; }
  @keyframes pulse { from { transform: scale(.5); opacity: 1; } to { transform: scale(2.4); opacity: 0; } }

  /* 오른쪽 전체 목록 */
  .plist { display: flex; flex-direction: column; }
  /* position: relative 는 행의 offsetTop 을 목록 기준으로 재기 위한 것이다 */
  .plist ol { position: relative; list-style: none; margin: 0; padding: 6px 6px 8px 8px; overflow-y: auto; flex: 1; min-height: 0; }
  /* 스크롤바: 얇은 검은 막대, 바탕 없음 */
  .plist ol { scrollbar-width: thin; scrollbar-color: var(--ink) transparent; }
  .plist ol::-webkit-scrollbar { width: 6px; }
  .plist ol::-webkit-scrollbar-track { background: transparent; }
  .plist ol::-webkit-scrollbar-thumb { background: var(--ink); }
  .plist ol::-webkit-scrollbar-button { display: none; }
  .li {
    all: unset; box-sizing: border-box; width: 100%; cursor: pointer;
    display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 1px 8px; align-items: baseline;
    padding: 7px 8px; font-size: 12px; border-bottom: 1px dashed var(--faint); transition: background .15s, opacity .2s;
  }
  .li:hover, .li.hot { background: var(--well); }
  .li.sel { background: var(--ink); color: var(--paper); }
  .li.sel .li-m, .li.sel .li-no { color: var(--paper); opacity: .7; }
  .li:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
  .li.dim { opacity: .3; }
  .li-no { color: var(--muted); font: 400 11px var(--mono); }
  .li-nm { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
  .li-nm span { overflow: hidden; text-overflow: ellipsis; }
  .li-d { font: 400 11px var(--mono); }
  .li-m { grid-column: 2 / 4; color: var(--muted); font: 400 11px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  @media (prefers-reduced-motion: reduce) {
    .wire, .ring, .rack, .pin-b, .pulse, .card-in { animation: none; }
    .pin, .chip, .btn { transition: none; }
  }
</style>

<!-- 도면·견본이 함께 쓰는 점묘·빗금·모눈 무늬 (portfolio02 와 같다) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="d1" width="3" height="3" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r=".85" fill="#151515"/></pattern>
    <pattern id="d2" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".75" fill="#151515"/></pattern>
    <pattern id="d3" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r=".75" fill="#151515"/></pattern>
    <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#151515" stroke-width=".8"/></pattern>
    <pattern id="gridp" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#dcdcd6" stroke-width="1"/></pattern>
  </defs>
</svg>

<div class="board">
  <header class="hud-l panel">
    <p class="ph">Career map <span>2007 — now</span></p>
    <div class="pb">
      <h1>이정민 개발 경력</h1>
      <p class="lede">연도별 구역에 프로젝트를 블록으로 올리고 시간 순서대로 이었습니다. 블록 한 칸은 참여 3개월입니다. 끌어서 둘러보고, 휠로 확대할수록 자세한 내용이 펼쳐집니다.</p>
      <div class="stats" id="stats"></div>
      <div class="steps" id="steps" aria-label="직위 이력"></div>
      <div class="legend" id="legend"></div>
      <div class="chips" id="chips" role="group" aria-label="기술 스택 필터"></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="프로젝트 도면">
    <div class="pan" id="pan"><div class="scene" id="scene"></div></div>
    <div class="labels" id="labels"></div>
    <div class="tip" id="tip" hidden></div>
    <div class="dock panel">
      <button class="btn play" id="play">▶ 따라가기</button>
      <div class="track" id="track" aria-label="연도 타임라인"></div>
      <div class="zoom">
        <button class="btn" data-zoom="1.25" aria-label="확대">+</button>
        <button class="btn" data-zoom="0.8" aria-label="축소">−</button>
        <button class="btn fit" data-zoom="fit">전체</button>
      </div>
    </div>
  </section>

  <div class="side">
    <aside class="card panel" id="card" aria-live="polite"></aside>
    <section class="plist panel" aria-label="전체 프로젝트">
      <h3 class="ph">All projects <span class="mono" id="pcount"></span></h3>
      <ol id="plist"></ol>
    </section>
  </div>
</div>

<script>
// [프로젝트, 시작 YY.MM, 종료 YY.MM | null(진행 중), 발주처, 근무회사, 직위, 역할, 산업군, 스택]
// portfolio02.html 과 같은 데이터다. 이력이 바뀌면 두 파일을 함께 고친다.
const P = [
  ['통합생산관리시스템 1차 운영', '07.02', '07.12', '금호석유', '버츄얼리드', '사원', '유지보수', 'mfg', ['JSP', 'Oracle']],
  ['통합생산관리시스템 2차 운영', '08.01', '08.12', '금호석유', '버츄얼리드', '사원', '유지보수', 'mfg', ['JSP', 'Oracle']],
  ['SK네트웍스 관리자페이지 운영', '09.01', '10.05', 'SK네트웍스', '버츄얼리드', '사원', '유지보수', 'biz', ['JSP', 'Oracle']],
  ['삼성생명', '11.06', '11.09', '삼성생명', '버츄얼리드', '사원', '유지보수', 'biz', ['JSP', 'Oracle']],
  ['중소기업중앙회', '11.09', '11.12', '중소기업중앙회', '화인에스아이', '사원', '유지보수', 'public', ['JSP', 'Oracle']],
  ['KBS IPTV ADMIN 페이지', '12.01', '12.06', 'KBS', '아르고 인포텍', '사원', '개발', 'telco', ['Java', 'JSP', 'Oracle']],
  ['농촌진흥청 ITCC (국제기술협력 시스템)', '12.06', '12.12', '농촌진흥청', 'RMBL', '사원', '개발', 'public', ['전자정부프레임워크', 'Oracle']],
  ['농촌진흥청 농업기상정보서비스', '13.06', '13.12', '농촌진흥청', 'U3CNC', '대리', '개발', 'public', ['JSP', 'Oracle']],

// 산업군은 색 대신 점묘 밀도로 구분한다. fill 은 SVG 무늬, css 는 같은 무늬의 CSS 배경(견본·타임라인 막대용).
const SECT = {
  mfg:    { name: '제조·반도체', fill: 'url(#d1)', css: 'radial-gradient(#151515 .85px, transparent 1.1px) 0 0 / 3px 3px, #fcfcfa' },

};
const INK = '#151515', PAPER = '#fcfcfa', BLUE = '#2f5bff', ORANGE = '#ff5a1f';
const sw = sec => `<i class="sw" style="background:${SECT[sec].css}"></i>`;

const now = new Date();
const ym = s => { const [y, m] = s.split('.').map(Number); return (2000 + y) * 12 + m - 1; };

const fmt = s => '20' + s;
// 종료월 포함 개월 수. 진행 중이면 오늘 기준.
const months = p => (p[2] ? ym(p[2]) : nowM) - ym(p[1]) + 1;
// 필터 키는 버전 번호를 뗀 이름이다 ("Vue 3" → "Vue").
const key = s => s.replace(/ \d[\d.]*$/, '');
const period = it => `${fmt(it.from)}–${it.to ? fmt(it.to) : '진행 중'}`;

const items = P.map((p, k) => ({
  k, name: p[0], from: p[1], to: p[2], client: p[3], company: p[4], pos: p[5], role: p[6], sec: p[7],

// ---- 아이소메트릭 도면 ----
// 바닥 평면 좌표 (x, y) 를 2:1 아이소메트릭 화면 좌표로 옮긴다. 바닥 요소는 같은 행렬을 SVG transform 으로 걸어
// 평면에 그대로 그리고(글자까지 바닥에 눕는다), 블록의 세로 면만 화면 좌표로 계산한다.
// 시작 연도마다 구역 하나를 두고, 시기(ERAS) 하나를 한 줄로 삼아 줄마다 지그재그로 놓는다.
// 구역 크기는 블록 2개(한 해 최대 프로젝트 수)에 맞춘 고정값이라 모든 구역이 격자에 정렬된다.
// 블록 간격 GAP 은 가까이 단계의 정보 카드(폭 240px)가 배율 NEAR 에서 옆 블록 카드와 겹치지 않게 잡은 값이다.
// LANE 은 블록 앞면에서 연결선 통로까지의 거리다. 화살촉(길이 ARW)이 이 안에 들어가야 한다.
// TAG 는 블록 앞면에서 날짜 태그 윗변까지의 거리, ZD 는 그 아래 태그(24)·연도 칩(30)·여백까지 담은 구역 깊이다.
const FP = 72, GAP = 130, PAD = 28, ZW = PAD * 2 + FP * 2 + GAP, GX = 76, GY = 96, LANE = 56, ARW = 16, AW = 8;
const TOP = 24, UH = 14, M = 90, CROP = 60, ER = 28;
const TAG = LANE + 14, ZD = TOP + FP + TAG + 24 + 60;
const iso = (x, y, z = 0) => [x - y, (x + y) / 2 - z];
const floor = z => `matrix(1 .5 -1 .5 0 ${-z})`;
const poly = pts => pts.map(p => p.map(v => +v.toFixed(1)).join(',')).join(' ');

// 시작 연도로 묶는다. to 가 null 이면 현재까지.
const ERAS = [
  { from: 2007, to: 2010, title: '운영·유지보수', desc: '금호석유 통합생산관리시스템과 SK네트웍스 관리자 페이지를 JSP·Oracle 로 운영했습니다.' },
  { from: 2011, to: 2014, title: '공공·미디어 SI', desc: '농촌진흥청, 한국환경공단, 송파구청 같은 공공 시스템과 KBS IPTV 관리자 페이지를 개발했습니다.' },
  { from: 2015, to: 2018, title: '통신·물류 시스템', desc: 'KT 차세대 BSS·BIT 와 SKT 상면관리를 거쳐 삼성 기흥공장 물류자동화 레이아웃을 D3.js 로 그렸습니다.' },
  { from: 2019, to: 2022, title: 'PLM 으로 이동', desc: '물류자동화 2차를 마치고 SK하이닉스·CJ·삼성 PLM 프로젝트로 옮겼습니다. RealGrid 와 Vue 를 이때부터 썼습니다.' },
  { from: 2023, to: null, title: 'PLM·MDM, Vue 3', desc: '삼성전자 P-BOM, 슈퍼컴 모니터링, 삼성전기 MDM 을 거쳐 지금은 만도 PLM 을 LEGO Framework·Vue 3 로 개발하고 있습니다.' },
];

const zones = [];
for (const it of items) {
  const year = fmt(it.from).slice(0, 4);
  if (zones.at(-1)?.year !== year) zones.push({ year, list: [] });
  zones.at(-1).list.push(it);
}
for (const e of ERAS) e.zones = zones.filter(z => +z.year >= e.from && (e.to === null || +z.year <= e.to));
const ZC = Math.max(...ERAS.map(e => e.zones.length)), ZR = ERAS.length;
const PW = ZC * ZW + (ZC - 1) * GX, PD = ZR * ZD + (ZR - 1) * GY;

ERAS.forEach((e, r) => e.zones.forEach((z, c) => {
  z.dir = r % 2 ? -1 : 1; // 짝수 줄은 오른쪽으로, 홀수 줄은 왼쪽으로 흐른다
  z.x = (z.dir > 0 ? c : ZC - 1 - c) * (ZW + GX);
  z.y = r * (ZD + GY);
  z.era = e;
  // 구역 안 블록도 흐름 방향대로 놓아야 선이 되돌아가지 않는다. 한 개면 가운데.
  z.list.forEach((it, i) => {
    const slot = z.list.length === 1 ? (ZW - FP) / 2 : PAD + (z.dir > 0 ? i : 1 - i) * (FP + GAP);
    it.x = z.x + slot;
    it.y = z.y + TOP;
    it.zone = z;
    it.u = Math.max(1, Math.ceil(it.m / 3));
  });
}));

// 시기 윤곽 위치: 한 줄(시기)의 구역들을 두르는 사각형
for (const e of ERAS) {
  const xs = e.zones.map(z => z.x);
  e.x0 = Math.min(...xs) - ER;
  e.y0 = e.zones[0].y - ER;
  e.w = Math.max(...xs) + ZW + ER - e.x0;
}

// 연결선 경로(바닥 평면 좌표). 블록 앞면에서 나와 다음 블록 앞면으로 들어간다. 뒷면으로 들어가면 블록 몸체에 가려진다.
// 같은 줄이면 앞쪽 통로로 옆 블록까지, 줄이 바뀌면 구역 바깥 틈으로 돌아 다음 줄 앞으로 들어간다.
const wires = [];
for (const it of items.slice(0, -1)) {
  const next = items[it.k + 1], cx = it.x + FP / 2, fy = it.y + FP, nx = next.x + FP / 2, ny = next.y + FP;
  const pts = [[cx, fy + 3], [cx, fy + LANE]];
  if (next.y === it.y) pts.push([nx, fy + LANE]);
  else {
    const z = it.zone, out = z.dir > 0 ? z.x + ZW + GX / 2 : z.x - GX / 2;
    pts.push([out, fy + LANE], [out, ny + LANE], [nx, ny + LANE]);
  }
  // 선은 화살촉 밑변에서 멈춘다. 끝까지 그으면 선이 화살촉 끝을 뚫고 나와 보인다.
  pts.push([nx, ny + 3 + ARW]);
  wires.push({ k: it.k, pts, nx, ny });
}

const topOf = it => iso(it.x + FP / 2, it.y + FP / 2, it.u * UH);
// 격자 끝은 잘라 내고, 위쪽은 가장 높은 블록과 핀까지 포함한다. SVG 는 viewBox 와 같은 픽셀 크기(1:1)로 그린다.
const vTop = Math.min(-CROP, ...items.map(it => topOf(it)[1] - 70));
const vX0 = -PD - CROP, vX1 = PW + CROP, vY1 = (PW + PD) / 2 + CROP;
const SW = vX1 - vX0, SH = vY1 - vTop;
const still = matchMedia('(prefers-reduced-motion: reduce)');

// 선 상자: 바닥 사각형 (x, y, w, d) 위 z0 에서 높이 h. 보이는 면은 앞-왼쪽(y+d 쪽)·앞-오른쪽(x+w 쪽)·윗면이다.
function box(x, y, w, d, z0, h, fl, fr, ft, cls = '') {
  const L0 = iso(x, y + d, z0), B0 = iso(x + w, y + d, z0), R0 = iso(x + w, y, z0);
  const L1 = iso(x, y + d, z0 + h), B1 = iso(x + w, y + d, z0 + h), R1 = iso(x + w, y, z0 + h), T1 = iso(x, y, z0 + h);
  return `<polygon class="f" points="${poly([L0, B0, B1, L1])}" fill="${fl}"/>`
    + `<polygon class="f" points="${poly([B0, R0, R1, B1])}" fill="${fr}"/>`
    + `<polygon class="f ${cls}" points="${poly([T1, R1, B1, L1])}" fill="${ft}"/>`;
}
// 블록: 흰 상자에 오른쪽 면은 산업군 점묘, 칸(3개월)마다 가는 이음선과 앞면의 검은 창. 진행 중인 블록은 윗면이 주황.
function block(it) {
  const { x, y, u } = it, h = u * UH;
  let s = box(x, y, FP, FP, 0, h, PAPER, SECT[it.sec].fill, it.to ? PAPER : ORANGE, 'top');
  for (let q = 0; q < u; q++) {
    if (q) s += `<polyline points="${poly([iso(x, y + FP, q * UH), iso(x + FP, y + FP, q * UH), iso(x + FP, y, q * UH)])}" fill="none" stroke="${INK}" stroke-width=".6"/>`;
    const z0 = q * UH + 4, z1 = q * UH + UH - 4;
    s += `<polygon points="${poly([iso(x + 20, y + FP, z0), iso(x + FP - 20, y + FP, z0), iso(x + FP - 20, y + FP, z1), iso(x + 20, y + FP, z1)])}" fill="${INK}"/>`;
  }
  return s;
}

function drawScene() {
  let fl = `<defs>
    <radialGradient id="fadeG" cx=".5" cy=".5" r=".5"><stop offset=".62" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="fade" maskContentUnits="objectBoundingBox"><rect width="1" height="1" fill="url(#fadeG)"/></mask>
  </defs>`;
  fl += `<rect x="${-M * 2}" y="${-M * 2}" width="${PW + M * 4}" height="${PD + M * 4}" fill="url(#gridp)" mask="url(#fade)"/>`;
  for (const e of ERAS) fl += `<rect class="era-rg" x="${e.x0}" y="${e.y0}" width="${e.w}" height="${ZD + ER * 2}" rx="26"/>`;
  const curZone = items.find(it => !it.to).zone;
  for (const z of zones) {
    // 구역 판: 검은 그림자 판 위에 흰 판. 진행 중인 프로젝트가 있는 구역만 점묘로 채운다.
    fl += `<rect x="${z.x + 7}" y="${z.y + 7}" width="${ZW}" height="${ZD}" rx="16" fill="${INK}"/>`;
    fl += `<rect x="${z.x}" y="${z.y}" width="${ZW}" height="${ZD}" rx="16" fill="${z === curZone ? 'url(#d3)' : PAPER}" stroke="${INK}" stroke-width="1.2" vector-effect="non-scaling-stroke"/>`;
    if (z === curZone) fl += `<rect x="${z.x}" y="${z.y}" width="${ZW}" height="${ZD}" rx="16" fill="${PAPER}" opacity=".78"/>`;
    // 연도 칩: 흰 상자 + 검은 그림자
    fl += `<rect x="${z.x + ZW / 2 - 36}" y="${z.y + ZD - 41}" width="78" height="30" fill="${INK}"/>`;
    fl += `<rect x="${z.x + ZW / 2 - 39}" y="${z.y + ZD - 44}" width="78" height="30" fill="${PAPER}" stroke="${INK}" stroke-width="1.2" vector-effect="non-scaling-stroke"/>`;
    fl += `<text class="zone-year" x="${z.x + ZW / 2}" y="${z.y + ZD - 23}" text-anchor="middle">${z.year}</text>`;
  }
  // 연결선 끝에는 블록으로 들어가는 화살촉, 길게 뻗은 구간 가운데에는 진행 방향 화살촉을 둔다.
  for (const w of wires) {
    const d = 'M' + w.pts.map(p => p.join(' ')).join('L');
    fl += `<path class="wire" data-w="${w.k}" d="${d}"/>`;
    fl += `<polygon class="arrow" data-w="${w.k}" points="${w.nx - AW},${w.ny + 3 + ARW} ${w.nx + AW},${w.ny + 3 + ARW} ${w.nx},${w.ny + 3}"/>`;
    for (let i = 1; i < w.pts.length; i++) {
      const [ax, ay] = w.pts[i - 1], [bx, by] = w.pts[i], len = Math.hypot(bx - ax, by - ay);
      if (len < 90) continue;
      const ux = (bx - ax) / len, uy = (by - ay) / len, mx = (ax + bx) / 2, my = (ay + by) / 2;
      fl += `<polygon class="arrow" data-w="${w.k}" points="${mx + ux * 6},${my + uy * 6} ${mx - ux * 5 - uy * 6},${my - uy * 5 + ux * 6} ${mx - ux * 5 + uy * 6},${my - uy * 5 - ux * 6}"/>`;
    }
  }
  for (const it of items) {
    const { x, y } = it, cx = x + FP / 2, fy = y + FP;
    fl += `<rect class="band" data-k="${it.k}" x="${x - 10}" y="${y - 10}" width="${FP + 20}" height="${FP + 20}" rx="9"/>`;
    // 블록 뒤쪽 바닥은 블록 몸체에 가려지므로 표시 글자는 태그 옆(앞쪽)에 둔다
    if (it.k === 0) fl += `<text class="start fine" x="${x - 12}" y="${fy + TAG + 17}" text-anchor="end">START</text>`;
    if (!it.to) {
      fl += `<rect class="ring" x="${x - 10}" y="${y - 10}" width="${FP + 20}" height="${FP + 20}" rx="9"/>`;
      fl += `<text class="live fine" x="${x + FP + 12}" y="${fy + TAG + 17}">NOW</text>`;
    }
    fl += `<rect class="fine" x="${x - 4}" y="${fy + TAG}" width="${FP + 8}" height="24" fill="${PAPER}" stroke="${INK}" stroke-width="1.1" vector-effect="non-scaling-stroke"/>`;
    fl += `<text class="tag-t fine" x="${cx}" y="${fy + TAG + 17}" text-anchor="middle">${fmt(it.from).slice(2)}</text>`;
  }

  // 블록: 한 칸 = 3개월. 뒤(y 작은 줄)부터, 같은 줄에서는 왼쪽(x 작은 쪽)부터 그려야 앞 블록이 뒤 블록을 덮는다.
  const CHIP = FP * .5, CI = (FP - CHIP) / 2;
  let blocks = '';
  for (const it of [...items].sort((a, b) => a.y - b.y || a.x - b.x)) {
    const { x, y } = it, h = it.u * UH, [bx, by] = topOf(it);
    blocks += `<g class="rack" data-k="${it.k}" style="--k:${it.k}" tabindex="0" role="button" aria-label="${it.k + 1}. ${it.name}, ${period(it)}, ${it.m}개월">
      ${block(it)}
      <g transform="${floor(h)}" pointer-events="none">
        <rect x="${x + CI}" y="${y + CI}" width="${CHIP}" height="${CHIP}" rx="4" fill="${INK}"/>
        <text class="chipnum" x="${x + FP / 2}" y="${y + FP / 2 + 6}" text-anchor="middle">${it.k + 1}</text>
      </g>
      ${it.to ? '' : `<circle class="pulse" cx="${bx}" cy="${by}" r="14"/>`}
    </g>`;
  }

  // 선택 핀: 선택한 블록 윗면 위에 떠서 위아래로 흔들린다
  const pin = `<g class="pin" id="pin"><g class="pin-b">
    <line x1="0" y1="-8" x2="0" y2="-34" stroke="${INK}" stroke-width="2"/>
    <circle cx="0" cy="-42" r="9" fill="${ORANGE}" stroke="${INK}" stroke-width="2"/>
  </g></g>`;

  document.getElementById('scene').innerHTML =
    `<svg viewBox="${vX0} ${vTop} ${SW} ${SH}" width="${SW}" height="${SH}" role="group" aria-label="연도별 구역 ${zones.length}개, 프로젝트 ${items.length}건 도면">
      <g transform="${floor(0)}">${fl}</g>${blocks}${pin}</svg>`;
}
drawScene();

// ---- 이동·확대 ----
// 화면 좌표 = 도면 좌표 × s + (tx, ty). 확대 배율은 ZMIN~ZMAX 로 제한한다.
// (s, tx, ty) 는 목표값, (vs, vtx, vty) 는 지금 화면에 그려진 값이다. 부드러운 이동은 두 값을 프레임마다 보간한다.
// 줌 단계: 배율 FAR 미만은 멀리, NEAR 이상은 가까이, 그 사이는 기본.
const stage = document.getElementById('stage'), panEl = document.getElementById('pan');
const ZMIN = .25, ZMAX = 2.5, FAR = .6, NEAR = 1.3, EASE_MS = 650;
let s = 1, tx = 0, ty = 0, vs = 1, vtx = 0, vty = 0, anim = 0;
const wide = matchMedia('(min-width: 761px)');

// 화면에 똑바로 세워 띄우는 라벨. 도면 좌표(ax, ay)를 따라다니지만 글자 크기는 배율과 무관하다.
const labels = document.getElementById('labels');
const svgXY = ([px, py]) => [px - vX0, py - vTop];
labels.innerHTML =
  ERAS.map(e => {
    const m = e.zones.flatMap(z => z.list).reduce((a, it) => a + it.m, 0);
    return `<div class="era-lab" data-a="${svgXY(iso(e.x0, e.y0 + ZD / 2 + ER)).join(',')}" title="${e.desc}">
      <b>${e.from}–${e.to ?? 'now'}</b><strong>${e.title}</strong><span>${e.zones.reduce((a, z) => a + z.list.length, 0)}건 · ${m}개월</span>
    </div>`;
  }).join('') +
  items.map(it => `<div class="ncard" data-k="${it.k}" data-a="${svgXY(topOf(it)).join(',')}">
    <div class="nc-h">${sw(it.sec)}No.${String(it.k + 1).padStart(2, '0')} · ${period(it)} · ${it.m}개월</div>
    <b>${it.name}</b>
    <div class="nc-m">${it.client} 발주 · ${it.company} ${it.pos} · ${it.role}</div>
    <div class="tags">${it.stack.map(t => `<span class="tag">${t}</span>`).join('')}</div>
  </div>`).join('');
const anchors = [...labels.children].map(el => ({ el, a: el.dataset.a.split(',').map(Number) }));

function render() {
  panEl.style.transform = `translate(${vtx}px, ${vty}px) scale(${vs})`;
  const far = vs < FAR, near = vs >= NEAR;
  stage.classList.toggle('lod-far', far);
  // 카드 폭 240 이 옆 블록 간격(FP + GAP)×배율보다 좁도록 가까이 단계 미만에서는 배율 비례로 줄인다
  labels.style.setProperty('--cs', Math.min(1, vs / NEAR).toFixed(3));
  stage.classList.toggle('lod-near', near);
  for (const { el, a } of anchors) {
    // 보이지 않는 단계의 라벨은 위치 계산을 건너뛴다. 정보 카드는 멀리에서, 시기 라벨은 가까이에서 숨는다.
    if (el.classList.contains('ncard') ? far : near) continue;
    el.style.left = `${a[0] * vs + vtx}px`;
    el.style.top = `${a[1] * vs + vty}px`;
  }
}
function apply(ease) {
  cancelAnimationFrame(anim);
  if (!ease || still.matches) { vs = s; vtx = tx; vty = ty; render(); return; }
  const from = [vs, vtx, vty], to = [s, tx, ty], t0 = performance.now();
  const step = t => {
    const p = Math.min(1, (t - t0) / EASE_MS), e = 1 - (1 - p) ** 3;
    [vs, vtx, vty] = from.map((f, i) => f + (to[i] - f) * e);
    render();
    if (p < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}
// 화면의 (px, py) 지점을 고정한 채 배율을 f 배 바꾼다
function zoomAt(f, px, py, ease) {
  const ns = Math.min(ZMAX, Math.max(ZMIN, s * f));
  tx = px - (px - tx) * ns / s;
  ty = py - (py - ty) * ns / s;
  s = ns;
  apply(ease);
}
// 떠 있는 패널을 뺀 보이는 영역. 넓은 화면에서는 왼쪽 패널(380)·오른쪽 카드(364)·아래 도크(90)를 비킨다.
function viewRect() {
  const w = stage.clientWidth, h = stage.clientHeight;
  return wide.matches ? { l: 380, r: w - 364, t: 20, b: h - 90 } : { l: 0, r: w, t: 0, b: h - 70 };
}
function fit() {
  const v = viewRect();
  s = Math.max(ZMIN, Math.min((v.r - v.l) / SW, (v.b - v.t) / SH));
  tx = (v.l + v.r) / 2 - SW * s / 2;
  ty = (v.t + v.b) / 2 - SH * s / 2;
  apply(true);
}
// 블록을 보이는 영역 가운데로 옮긴다
function focusOn(k, ease) {
  const [px, py] = topOf(items[k]), v = viewRect();
  tx = (v.l + v.r) / 2 - (px - vX0) * s;
  ty = (v.t + v.b) / 2 - (py - vTop) * s;
  apply(ease);
}

// 드래그: 4px 넘게 움직였을 때만 이동으로 보고, 그 뒤 따라오는 click 은 선택으로 처리하지 않는다.
// 포인터 캡처도 이동이 확정된 뒤에 건다. 먼저 걸면 블록 위에서 누른 click 의 대상이 도면 창으로 바뀐다.
let drag = null, dragged = false;
stage.addEventListener('pointerdown', e => {
  if (e.button !== 0 || e.target.closest('.dock')) return;
  drag = { x: e.clientX, y: e.clientY, tx, ty, id: e.pointerId, moved: false };
});
stage.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.abs(dx) + Math.abs(dy) > 4) {
    drag.moved = true;
    stage.classList.add('drag');
    stage.setPointerCapture(drag.id);
    stopTour();
  }
  if (drag.moved) { tx = drag.tx + dx; ty = drag.ty + dy; apply(false); }
});
const endDrag = () => {
  if (drag?.moved) dragged = true;
  drag = null;
  stage.classList.remove('drag');
};
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);
stage.addEventListener('click', e => { if (dragged) { e.stopPropagation(); dragged = false; } }, true);
// 휠로 커서 위치를 중심으로 확대·축소한다. 배율 변화는 굴린 양에 비례하므로 트랙패드의 작은 입력도 부드럽다.
stage.addEventListener('wheel', e => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  zoomAt(Math.exp(-e.deltaY * .0015), e.clientX - r.left, e.clientY - r.top, false);
}, { passive: false });
stage.querySelector('.zoom').addEventListener('click', e => {
  const b = e.target.closest('[data-zoom]');
  if (!b) return;
  if (b.dataset.zoom === 'fit') fit();
  else zoomAt(+b.dataset.zoom, stage.clientWidth / 2, stage.clientHeight / 2, true);
});

// ---- 툴팁 ----
const tip = document.getElementById('tip');
stage.addEventListener('pointermove', e => {
  const r = e.target.closest?.('.rack');
  if (!r || drag?.moved) { tip.hidden = true; return; }
  const it = items[r.dataset.k], rect = stage.getBoundingClientRect();
  tip.innerHTML = `<b>${it.k + 1}. ${it.name}</b><span>${period(it)} · ${it.company}</span>`;
  tip.style.left = `${e.clientX - rect.left}px`;
  tip.style.top = `${e.clientY - rect.top}px`;
  tip.hidden = false;
});
stage.addEventListener('pointerleave', () => { tip.hidden = true; });

// ---- 타임라인 ----
// 2007년 1월부터 오늘까지를 가로 축으로 두고, 프로젝트마다 기간만큼 점묘 막대를 놓는다.
const T0 = ym(items[0].from.slice(0, 2) + '.01'), T1 = nowM + 1;
const pct = m => ((m - T0) / (T1 - T0) * 100).toFixed(3);
const track = document.getElementById('track');
let yrs = '';
for (let y = 2007; y <= now.getFullYear(); y++) yrs += `<span class="yr" style="left:${pct(y * 12)}%">'${String(y).slice(2)}</span>`;
track.innerHTML = `<div class="axis"></div>` + items.map(it => {
  const a = ym(it.from), b = (it.to ? ym(it.to) : nowM) + 1;
  return `<button class="seg" data-k="${it.k}" style="left:${pct(a)}%;width:${pct(T0 + b - a)}%;background:${SECT[it.sec].css}" aria-label="${it.k + 1}. ${it.name}"></button>`;
}).join('') + yrs;

// ---- 따라가기: 1번부터 차례로 도면을 옮기며 보여 준다 ----
const playBtn = document.getElementById('play');
let tour = null;
function stopTour() {
  clearInterval(tour);
  tour = null;
  playBtn.textContent = '▶ 따라가기';
}
playBtn.addEventListener('click', () => {
  if (tour) return stopTour();
  // 따라가기는 가까이 단계로 확대해 정보 카드를 펼친 채 이동한다
  if (s < NEAR) s = NEAR + .05;
  select(cur === items.length - 1 ? 0 : cur + 1, true);
  tour = setInterval(() => (cur === items.length - 1 ? stopTour() : select(cur + 1, true)), 2200);
  playBtn.textContent = '❚❚ 멈춤';
});

// ---- 오른쪽 전체 목록 ----
const plist = document.getElementById('plist');
document.getElementById('pcount').textContent = items.length;
plist.innerHTML = items.map(it => `<li><button class="li" data-k="${it.k}">
  <span class="li-no">${String(it.k + 1).padStart(2, '0')}</span>
  <span class="li-nm">${sw(it.sec)}<span>${it.name}</span></span>
  <span class="li-d">${it.m}개월</span>
  <span class="li-m">${period(it)} · ${it.client}</span>
</button></li>`).join('');

// ---- 선택 ----
const card = document.getElementById('card');
let cur = items.findIndex(it => !it.to);
// follow 가 참이면 도면을 그 블록으로 옮긴다. 도면에서 블록을 직접 누른 경우는 이미 보고 있으므로 옮기지 않는다.
function select(k, follow) {
  cur = (k + items.length) % items.length;
  if (follow) focusOn(cur, true);
  const it = items[cur], [px, py] = topOf(it);
  document.querySelectorAll('[data-k]').forEach(el => el.classList.toggle('sel', +el.dataset.k === cur));
  // 이 블록으로 들어오는 선(cur-1)과 나가는 선(cur)을 강조한다
  document.querySelectorAll('[data-w]').forEach(el => el.classList.toggle('lit', +el.dataset.w === cur || +el.dataset.w === cur - 1));
  document.getElementById('pin').setAttribute('transform', `translate(${px} ${py})`);
  // 목록 안에서만 스크롤한다. scrollIntoView 는 페이지까지 움직일 수 있어 쓰지 않는다.
  const li = plist.querySelector(`[data-k="${cur}"]`).parentElement;
  if (li.offsetTop < plist.scrollTop || li.offsetTop + li.offsetHeight > plist.scrollTop + plist.clientHeight) {
    plist.scrollTo({ top: li.offsetTop - plist.clientHeight / 2, behavior: still.matches ? 'auto' : 'smooth' });
  }
  card.innerHTML = `<p class="ph">No.${String(cur + 1).padStart(2, '0')} <span>${sw(it.sec)} ${SECT[it.sec].name}</span></p>
  <div class="pb card-in">
    <h2>${it.name}</h2>
    <div class="per">${period(it)} · <b>${it.m}개월</b></div>
    <dl>
      <dt>발주처</dt><dd>${it.client}</dd>
      <dt>근무회사</dt><dd>${it.company} · ${it.pos}</dd>
      <dt>역할</dt><dd>${it.role}</dd>
    </dl>
    <div class="tags">${it.stack.map(t => `<span class="tag">${t}</span>`).join('')}</div>
    <div class="nav"><button class="btn" data-step="-1">← PREV</button><button class="btn" data-step="1">NEXT →</button></div>
  </div>`;
}
select(cur);
// 첫 화면: 전체 보기 대신 진행 중인 프로젝트를 가운데 두고 정보 카드가 읽히는 배율로 연다
s = 1.1;
focusOn(cur, false);

document.addEventListener('click', e => {
  const rack = e.target.closest('.rack, .ncard');
  if (rack) { stopTour(); return select(+rack.dataset.k); }
  const seg = e.target.closest('.seg, .li');
  if (seg) { stopTour(); return select(+seg.dataset.k, true); }
  const b = e.target.closest('[data-step]');
  if (b) { stopTour(); select(cur + +b.dataset.step, true); }
});
document.addEventListener('keydown', e => {
  const r = e.target.closest?.('.rack');
  if (r && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select(+r.dataset.k); }
  if (e.key === 'ArrowLeft') { stopTour(); select(cur - 1, true); }
  if (e.key === 'ArrowRight') { stopTour(); select(cur + 1, true); }
  if (e.key === 'Escape') stopTour();
});
// 블록·정보 카드·타임라인 막대·목록 행을 서로 강조한다
document.addEventListener('mouseover', e => {
  const t = e.target.closest('.rack, .seg, .ncard, .li');
  document.querySelectorAll('.hot').forEach(el => el.classList.remove('hot'));
  if (t) document.querySelectorAll(`[data-k="${t.dataset.k}"]`).forEach(el => el.classList.add('hot'));
});

// ---- 스택 필터: 2건 이상 쓴 스택 상위 8개 ----
const chips = document.getElementById('chips');
chips.innerHTML = `<button class="chip" data-f="" aria-pressed="true">전체</button>` +
  ranked.filter(([, n]) => n >= 2).slice(0, 8).map(([k, n]) => `<button class="chip" data-f="${k}" aria-pressed="false">${k} ${n}</button>`).join('');
chips.addEventListener('click', e => {
  const b = e.target.closest('.chip');
  if (!b) return;
  const f = b.dataset.f;
  for (const c of chips.querySelectorAll('.chip')) c.setAttribute('aria-pressed', c === b);
  document.querySelectorAll('.rack, .seg, .ncard, .li').forEach(el => el.classList.toggle('dim', !!f && !items[el.dataset.k].keys.has(f)));
});

// ---- 직위 이력: 같은 직위가 이어지는 구간을 묶는다. 마지막(지금) 칸은 주황. ----
const steps = [];
for (const it of items) {
  const last = steps.at(-1);
  if (last && last.pos === it.pos) { last.to = it.to; last.n++; }
  else steps.push({ pos: it.pos, from: it.from, to: it.to, n: 1 });
}
// 연도는 두 자리로 줄이고, 시작·끝 연도가 같으면 하나만 쓴다
const yy = v => v.slice(0, 2);
document.getElementById('steps').innerHTML = steps.map((st, i) => {
  const a = yy(st.from), b = st.to ? yy(st.to) : 'now';
  return `<span class="step${i === steps.length - 1 ? ' now' : ''}" title="프로젝트 ${st.n}건"><b>${st.pos}</b><span>${a === b ? `'${a}` : `'${a}–${st.to ? `'${b}` : b}`}</span></span>`;
}).join('<i>›</i>');
</script>
